# First-party @esportsplus packages are trusted, so they bypass the
# minimumReleaseAge supply-chain gate — this lets a freshly published
# reactivity (or any of our own packages) be consumed immediately instead
# of waiting out the release-age cutoff.
minimumReleaseAgeExclude:
  - '@esportsplus/reactivity@0.36.4 || 0.36.5 || 0.36.6 || 0.36.7 || 0.37.0'
  - '@esportsplus/utilities@0.28.3 || 0.28.4'
  - '@esportsplus/typescript@0.34.1 || 0.34.2 || 0.34.3 || 0.34.4'
  - '@esportsplus/*'
  - happy-dom@20.13.2 || 20.14.0
  - tsc-alias@1.9.4
  - '@vitest/mocker@5.0.0'
  - '@vitest/spy@5.0.0'
  - vitest@5.0.0
